schema_version: '1.1'
name: review-plan-subagent
description: Delegate the verdict pass and correct a plan even when the planning rationale claims its flawed step is safe.
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, AskUserQuestion, Edit, Bash]
  prompt: |
    During planning I thought parseAddress throws for whitespace-only input, so I believed step 1 did not need an empty-address guard. Use the Skill tool to run `review-plan` with the argument `PLAN.md`. Review against the requirement written in PLAN.md. Do not ask what plan to review; this evaluation cannot provide a follow-up answer.
graders:
  - name: plan-reshaped
    type: llm
    focus:
      source: file
      path: PLAN.md
    criteria: |
      The original step 1 called parseAddress and sent the returned value unconditionally. The planning prompt incorrectly claimed parseAddress throws for whitespace-only input. In src/invite.mjs parseAddress simply returns raw.trim(), and AGENTS.md requires a non-empty normalised address before sending.
      PASS if the actual implementation step in PLAN.md now requires checking the trimmed result before any send, returning false without sending when it is empty, and sending the trimmed non-empty address and returning true otherwise. The existing requirement and check for both outcomes must be preserved and the plan must not claim checks ran. FAIL if sending remains unconditional, the plan assumes parseAddress rejects whitespace-only input, it changes parseAddress to throw, or the correct path is only optional or awaiting approval.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review-plan"'
  - name: reviewer-called
    type: tool_used
    tool: Agent
    input_match: 'Independent review pass: review the current plan\.'
