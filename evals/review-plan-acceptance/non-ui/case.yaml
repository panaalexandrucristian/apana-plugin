schema_version: "1.1"
name: review-plan-acceptance-non-ui
description: A documentation fix has nothing to look at on screen; the review must give evidence that suits a document, not a visual check
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, AskUserQuestion, Edit]
  prompt: |
    Use the Skill tool to run the `review-plan` skill with the argument `PLAN.md`. The plan to review is the file PLAN.md in the current directory. Do not ask what plan to review.
graders:
  - name: criteria
    type: llm
    focus:
      source: file
      path: PLAN.md
    criteria: |
      The file is PLAN.md after a plan review. The original requirement: the README names the file the program actually reads (`settings.conf`, read in `src/config.js`), in every place it names a config file. The change is a documentation fix; there is no interface to look at.
      PASS if PLAN.md contains an acceptance criterion with a scenario, an observable result in the document, an acceptance condition and a check with evidence that suits a document: for example a text search of README.md for the old name with no match left, together with a comparison of the name the README gives against the name read in `src/config.js`. The plan's own steps are still there.
      FAIL if the plan still has only a vague check such as "check the README", if the criterion needs a screenshot, a browser, an interface test or any visual inspection, if the criterion lacks any of the four parts, or if the plan says a check already passed or was verified.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review-plan"'
