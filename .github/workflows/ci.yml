name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ripgrep is what find-usages and class-graph shell out to.
      - run: sudo apt-get install -y ripgrep
      # Node suite: hooks, skills, the self tests and the end-to-end test of compact-handoff. Offline: no model, no network.
      - name: Node suite
        run: npm test
      # Offline Python suites of the claude-auto wrapper and of its installer and uninstaller (a fake `claude`, a temporary HOME).
      - name: claude-auto (offline Python suites)
        run: npm run test:claude-auto
      # Offline: the opencode-auto plugin parts with a fake context, and its installer, uninstaller and launcher (a fake `opencode`, a temporary HOME).
      - name: opencode-auto (offline suites)
        run: npm run test:opencode-auto
      - name: Legacy scope launcher uninstall
        run: npm run test:claude-scope
      # Offline bridge tests; the real proxy lifecycle case skips when CLIProxyAPI is not installed.
      - name: subscription bridge (offline Python suite)
        run: npm run test:claude-openai
      # Copilot bridge uses only offline fixtures: no native download, login or inference.
      - name: Copilot bridge (offline Python suite)
        run: npm run test:claude-copilot
      # Throw-away homes only: job files for all three systems, no launchctl, systemctl or schtasks.
      - name: OpenCode plugin skills sync (offline Python suite)
        run: npm run test:opencode-plugin-skills-sync
