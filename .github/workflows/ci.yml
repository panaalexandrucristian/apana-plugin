name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ripgrep is what find-usages and class-graph shell out to.
      - run: sudo apt-get install -y ripgrep
      # Node suite: hooks, skills, the self tests and the end-to-end test of compact-handoff. Offline: no model, no network.
      - name: Node suite
        run: npm test
      # Offline Python suites of the claude-auto wrapper and of its installer and uninstaller (a fake `claude`, a temporary HOME).
      - name: claude-auto (offline Python suites)
        run: npm run test:claude-auto
      # Offline scope hook gates and legacy launcher removal; no OS sandbox is claimed.
      - name: scope hooks and legacy uninstall
        run: npm run test:claude-scope
      # Offline bridge tests; the real proxy lifecycle case skips when CLIProxyAPI is not installed.
      - name: subscription bridge (offline Python suite)
        run: npm run test:claude-openai
      # Registry, bundled API and live-driver regressions use only temporary fixtures; no model credentials.
      - name: session cooperation (offline Python suite)
        run: npm run test:cooperation
      - name: code-rag setup (offline Python suite)
        run: npm run test:code-rag-setup
      # Test dependencies only; no torch, embedding model or installer execution.
      - name: Install code-rag test dependencies
        run: python3 -m pip install -c skills/code-rag-setup/scripts/requirements.txt numpy scipy bm25s llama-index-core tree-sitter tree-sitter-language-pack
      - name: code-rag (offline Python suite, skips fail)
        env:
          CODE_RAG_FAKE_EMBED: "1"
          HF_HUB_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: npm run test:code-rag
